<text x="330" y="330" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">Impedance-balanced: hot is driven through R16 and C11, cold held to ground through R17 and C12 - the</text>
<text x="330" y="342" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">same impedance - so the desk rejects hum picked up along the cable.</text>
<text x="330" y="354" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">C11 and C12 block a desk's +48 V phantom power: rated 100 V, their + towards the XLR.</text>
<text x="330" y="366" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">Use an XLR whose pin 1 is apart from its metal housing (Neutrik D-series), or the box undoes LIFT.</text>
<text x="330" y="378" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">For the most hum rejection, a 10:1 DI transformer can take the place of R16, R17, C11 and C12.</text>
