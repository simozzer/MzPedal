<text x="20" y="420" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">Grounds: keep every wire</text>
<text x="20" y="432" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">short, and join the jacks'</text>
<text x="20" y="444" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">sleeves to the main board</text>
<text x="20" y="456" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">only.</text>
<text x="700" y="600" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">The Codec Zero needs nothing but the Pi's</text>
<text x="700" y="612" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">header: its power and its audio clocks come</text>
<text x="700" y="624" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">from the Pi. Its own button, LEDs, speaker</text>
<text x="700" y="636" font-size="8.5" text-anchor="start" font-weight="normal" fill="#333">terminals and microphones are not used.</text>
</svg>